apiVersion: apps/v1
kind: Deployment
metadata:
  name: gemini-enterprise-admin-migration-tool
  namespace: gemini-migration
  labels:
    app.kubernetes.io/name: gemini-enterprise-admin-migration-tool
    app.kubernetes.io/part-of: eai-3542282
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gemini-enterprise-admin-migration-tool
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gemini-enterprise-admin-migration-tool
    spec:
      serviceAccountName: gemini-migration-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migration-tool
          image: gcr.io/fedex-prod-registry/gemini-enterprise-admin-migration-tool:v1.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
            - name: reports-volume
              mountPath: /app/reports
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "8080"
            - name: ALLOWED_AUTH_DOMAINS
              value: "fedex.com"
      volumes:
        - name: tmp-volume
          emptyDir: {}
        - name: reports-volume
          emptyDir: {}
